version: 1
project_id: "g4g-operate-demo"
agent_id: "operator-awmalik"

scenarios:
  # Scenario 1: PR Code & IaC Review (Milestone 1 MVP)
  code_changes:
    enabled: true
    triggers:
      - pull_request.opened
      - pull_request.synchronize
      - issue_comment.created
    trigger_command: "/autocloud review"
    pr_mode: "companion_pr"

  # Scenario 2: Issue & Bug Implementation (Milestone 2 / Post-MVP)
  issue_implementation:
    enabled: false
    triggers:
      - issues.labeled
      - issue_comment.created
    trigger_labels:
      - "autocloud-implement"
    trigger_command: "/autocloud implement"
    base_branch: "main"
