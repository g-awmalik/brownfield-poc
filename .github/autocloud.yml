version: 1
project_id: "g4g-operate-demo"
agent_id: "operator-awmalik"

scenarios:
  # Scenario 1: PR Code & IaC Review
  code_changes:
    enabled: true
    triggers:
      - pull_request.opened
      - pull_request.synchronize
      - issue_comment.created
    trigger_command: "/autocloud review"
    # Options: "inline_comments" (default), "companion_pr", "comment_only"
    pr_mode: "inline_comments"

  # Scenario 2: Issue & Bug Implementation (WORK IN PROGRESS - Not available yet)
  issue_implementation:
    enabled: false
    triggers:
      - issues.labeled
      - issue_comment.created
    trigger_labels:
      - "autocloud-implement"
    trigger_command: "/autocloud implement"
    base_branch: "main"
